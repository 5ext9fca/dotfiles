mode: rule
log-level: info
ipv6: false
allow-lan: false

mixed-port: 7897

unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"

proxies:
  - name: "Vultr-JP"
    type: vless

    server: 198.13.57.54
    port: 443
    uuid: "4fc199d7-8e70-45b4-b18f-f3e45407e5c6"

    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: "www.mi.com"

    reality-opts:
      public-key: "J58F2aqvMjGi3SDmZIjwYY8wpAsxqbddtmUL5F0-xg0"
      short-id: "27bb3e8c080bf4de"

    client-fingerprint: chrome

  - name: "Vultr-SG"
    type: vless

    server: 139.180.209.160
    port: 443
    uuid: "4fc199d7-8e70-45b4-b18f-f3e45407e5c6"

    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: "www.mi.com"

    reality-opts:
      public-key: "J58F2aqvMjGi3SDmZIjwYY8wpAsxqbddtmUL5F0-xg0"
      short-id: "27bb3e8c080bf4de"

    client-fingerprint: chrome

proxy-providers:
  Airport:
    type: http
    url: "https://api.linkcube.dev/sub?target=clash&emoji=true&udp=true&scv=true&new_name=true&filename=LinkCube&url=https%3A%2F%2Fapi-linkcube.net%2Fsubscribe%2Fnjbee-pvakpq_y"
    proxy: DIRECT
    path: ./proxy_providers/airport.yaml
    # 每 6 小时更新
    interval: 21600
    health-check:
      enable: true
      url: "https://www.youtube.com/generate_204"
      interval: 300
      timeout: 5000

proxy-groups:
  - name: PROXY
    type: select

    proxies:
      - AUTO
      - FALLBACK
      - Vultr-JP
      - Vultr-SG
      - DIRECT
    use:
      - Airport

  - name: AUTO
    type: url-test

    proxies:
      - Vultr-JP
      - Vultr-SG
    use:
      - Airport

    url: "https://www.youtube.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: FALLBACK
    type: fallback

    # 顺序代表优先级：
    proxies:
      - Vultr-JP
      - Vultr-SG
    use:
      - Airport

    url: "https://www.youtube.com/generate_204"
    interval: 300
    lazy: true

  - name: Development
    type: select
    proxies:
      - PROXY
      - AUTO
      - FALLBACK
